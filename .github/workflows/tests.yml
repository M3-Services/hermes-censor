name: tests

# Unit tests only: they need neither Hermes nor a provider. The integration tests (real Hermes + fake local provider)
# and the install-scanner gate (tests/test_install_scan.py, skipped here) need the Hermes sources: run them locally,
# see docs/VALIDATION_REPORT.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install pytest pyyaml
      # keepassxc-cli makes the real-KeePassXC tests run instead of being skipped (fictional databases only)
      - name: Install KeePassXC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keepassxc
      - name: Install KeePassXC (Windows)
        if: runner.os == 'Windows'
        run: choco install keepassxc -y --no-progress
      - name: Unit tests
        run: python -m pytest -c tests/pytest.ini tests --ignore=tests/integration -q -rs
